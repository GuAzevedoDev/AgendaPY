# Config de exemplo do Nginx como reverse proxy na frente do Gunicorn.
# Ajuste os placeholders (SEU_DOMINIO, caminhos de certificado, upstream)
# quando for integrar com o Docker.

# Upstream do Gunicorn. Se app e Nginx estiverem no mesmo host (fora de
# container), 127.0.0.1:8000 bate com o bind do gunicorn.conf.py. Dentro do
# docker-compose, troque pelo nome do serviço, ex.: app:8000.
upstream agendapy_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Redireciona todo tráfego HTTP pra HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SEU_DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS — só habilite depois de confirmar que o HTTPS está funcionando,
    # pois força o navegador a nunca mais tentar HTTP nesse domínio.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 5M;

    access_log /var/log/nginx/agendapy.access.log;
    error_log  /var/log/nginx/agendapy.error.log;

    # Arquivos estáticos servidos direto pelo Nginx — não precisa passar
    # pelo Gunicorn/Flask pra isso. Ajuste o path se mudar a estrutura do
    # projeto.
    location /static/ {
        alias /caminho/para/AgendaPY/views/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://agendapy_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
