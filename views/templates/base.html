<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <title>{%block titulo%}{%endblock%}</title>
  {%block script_tag%}
  <script defer src="../static/js/{%block js_arquivo%}{%endblock%}"></script>{%endblock%}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body id="{%block id%}{%endblock%}">
  <button type="button" class="btn-menu-mobile" aria-label="Abrir menu">
    <svg width="24" height="18" viewBox="0 0 24 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 1H23" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M1 9H23" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M1 17H23" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
  <div class="overlay-menu-mobile"></div>
  {%block conteudo%}
  {%endblock%}
</body>

</html>
