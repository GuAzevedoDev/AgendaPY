services:
  db:
    #Coloco o postgres apenas na versao 16 para nao ficar atualizando e quebrar aplicacao(boa pratica)
    image: postgres:16-alpine

    #Sempre reiniciar se caso o conteiner cair ou se o proprio docker reiniciar(always), mas se eu parar porque eu quero ele tambem reinicia, esse unless-stopped respeita minha decisao
    restart: unless-stopped

    #Aumento o limite de memoria para o db padrao e de 64mb o que pode causar erros(boa pratica) 
    shm_size:  128mb

    #Uma senha que ira pedir na hora de subir a aplicacao/Usuario/nome do banco, sempre puxar do .env (boa pratica)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    #Mesmo se o db for stopado, salvara os dados nesse volumes
    volumes:
      - pgdata:/var/lib/postgresql/data
    
    #Faz o docker consultar periodicamente se o postgres esta pronto
    healthcheck:
      #Test Confere o postgres esta preparado para receber conexoes e se o db esta acessivel 
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      #Da um tempo antes de comecar a contar os retries, que sao as falhas, importante pois o servidor pode demorar para iniciar
      start_period: 10s

  app:
    #Builda a imagem a partir do Dockerfile na raiz do projeto
    build: .
    restart: unless-stopped
    #Le SECRET_KEY, DATABASE_URL etc. direto do .env
    env_file: .env
    environment:
      #Sem isso o gunicorn escuta so em 127.0.0.1 (dentro do proprio container) e o proxy reverso nunca alcanca
      - GUNICORN_BIND=0.0.0.0:8000
      #Sem isso o container roda em UTC e datetime.now() fica 3h a frente do horario real
      - TZ=America/Sao_Paulo
    #So sobe depois do banco estar de fato pronto pra aceitar conexao
    depends_on:
      db:
        condition: service_healthy
    #Confere se o Flask esta respondendo antes do proxy reverso comecar a mandar trafego pra ca
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agenda.rule=Host(`studiomaliazevedo.com.br`)"
      - "traefik.http.routers.agenda.entrypoints=websecure"
      - "traefik.http.routers.agenda.tls.certresolver=letsencrypt"
      - "traefik.http.services.agenda.loadbalancer.server.port=8000"
      - "traefik.docker.network=agenda_default"
  adminer:
    #Interface web para gerenciar o db
    image: adminer
    restart: unless-stopped
    #Sem ports: exposta so na rede interna do compose. Para acessar,
    #usar SSH tunnel: ssh -L 8080:localhost:8080 usuario@vps
    #e abrir localhost:8080 no navegador local
    depends_on:
      db:
        condition: service_healthy


#Passo para o volumes de cima
volumes:
  pgdata: